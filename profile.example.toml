# Vorlage fuer das Profil. Kopieren nach ~/.config/local-agents/profile.toml
# (oder Pfad in LOCAL_AGENTS_PROFILE setzen) und anpassen.
# Die echte Datei gehoert nicht ins Repo: Sie enthaelt Kundennamen.

# Technische Domains, die bei der Zuordnung nicht zaehlen (z. B. Teams-Kanaele).
ignored_domains = ["emea.teams.ms"]

[person]
name = "Erika Beispiel"
employer = "Beispiel GmbH"
role = "Teamleitung"
# Bundesland des Arbeitsorts (Kuerzel wie HE, BY, NW): Feiertage, die dort
# nicht gelten, blendet der Kalender-Agent aus.
state = "HE"

# kind = "intern": Arbeitgeber. Ein Termin ist intern, wenn der Titel ein
# Stichwort enthaelt oder die Teilnehmer ueberwiegend diese Domains haben.
[[contexts]]
id = "intern"
kind = "intern"
label = "Intern (Beispiel GmbH)"
description = "Teamleitung, interne Abstimmungen"
domains = ["beispiel.de"]
keywords = []

# kind = "kunde": Ein Kunde je Block. Ein Termin gehoert zum Kunden, wenn der
# Titel ein Stichwort enthaelt, der Kunde einlaedt oder mindestens so viele
# Kunden- wie interne Adressen eingeladen sind. Regeln im Detail: README.
[[contexts]]
id = "kunde-acme"
kind = "kunde"
label = "Kunde ACME"
description = "Projekt Datenplattform"
domains = ["acme.example"]
keywords = ["acme", "datenplattform"]
# Stresslevel des Projekts: "niedrig", "mittel" oder "hoch". Ab "mittel" schlaegt
# der Kalender-Agent vor, interne Termin-Bloecke zu verschieben.
stress = "mittel"
# Tage beim Kunden: Interne Termine an diesen Tagen schlaegt der Agent immer
# zum Verschieben vor.
onsite_days = ["Mi"]

# Planungs-Agent: Aufgaben sind lead_days Tage vor dem Termin fertig (1 = am
# Vortag). Termine, deren Titel eines der Stichwoerter in skip enthaelt,
# bekommen keine Aufgabe, z. B. skip = ["Company Call"].
# Interne Termine, die dem Kundenprojekt weichen sollten, bekommen zusaetzlich
# eine Aufgabe "Nachricht an <Organisator>", faellig move_lead_days Tage vorher.
[planning]
lead_days = 1
move_lead_days = 3
skip = []
