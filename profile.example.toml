# Vorlage fuer das Profil. Kopieren nach ~/.config/local-agents/profile.toml
# (oder Pfad in LOCAL_AGENTS_PROFILE setzen) und anpassen.
# Die echte Datei gehoert nicht ins Repo: Sie enthaelt Kundennamen.

# Technische Domains, die bei der Zuordnung nicht zaehlen (z. B. Teams-Kanaele).
ignored_domains = ["emea.teams.ms"]

[person]
name = "Erika Beispiel"
employer = "Beispiel GmbH"
role = "Teamleitung"
# Bundesland des Arbeitsorts (Kuerzel wie HE, BY, NW): Feiertage, die dort
# nicht gelten, blendet der Kalender-Agent aus.
state = "HE"

# kind = "intern": Arbeitgeber. Ein Termin ist intern, wenn der Titel ein
# Stichwort enthaelt oder die Teilnehmer ueberwiegend diese Domains haben.
[[contexts]]
id = "intern"
kind = "intern"
label = "Intern (Beispiel GmbH)"
description = "Teamleitung, interne Abstimmungen"
domains = ["beispiel.de"]
keywords = []

# kind = "kunde": Ein Kunde je Block. Ein Termin gehoert zum Kunden, wenn der
# Titel ein Stichwort enthaelt, der Kunde einlaedt oder mindestens so viele
# Kunden- wie interne Adressen eingeladen sind. Regeln im Detail: README.
[[contexts]]
id = "kunde-acme"
kind = "kunde"
label = "Kunde ACME"
description = "Projekt Datenplattform"
# Rolle in diesem Kontext, falls sie von der allgemeinen Rolle abweicht. Der
# Termin-Agent leitet daraus ab, was du in einem Termin liefern solltest.
role = "Solution Architect"
# Ordner mit den User Stories des Projekts als Markdown, eine Datei je Feature.
# Ausserhalb des Repos und nicht in einem Cloud-Ordner ablegen (Kundendaten).
# stories_dir = "~/local-agents-vault/kunde-acme"
domains = ["acme.example"]
keywords = ["acme", "datenplattform"]
# Stresslevel des Projekts: "niedrig", "mittel" oder "hoch". Ab "mittel" schlaegt
# der Kalender-Agent vor, interne Termin-Bloecke zu verschieben.
stress = "mittel"
# Tage beim Kunden: Interne Termine an diesen Tagen schlaegt der Agent immer
# zum Verschieben vor.
onsite_days = ["Mi"]

# Planungs-Agent: Aufgaben sind lead_days Tage vor dem Termin fertig (1 = am
# Vortag). Termine, deren Titel eines der Stichwoerter in skip enthaelt,
# bekommen keine Aufgabe, z. B. skip = ["Company Call"].
# Interne Termine, die dem Kundenprojekt weichen sollten, bekommen zusaetzlich
# eine Aufgabe "Nachricht an <Organisator>", faellig move_lead_days Tage vorher.
[planning]
lead_days = 1
move_lead_days = 3
skip = []
# Vor jedem Lesen der Aufgaben gleicht der Code die Datenbank mit dem Kalender
# ab (verschobene, abgesagte, neue Termine). Mit false nur beim Planen.
sync = true

# Kalenderwache (python -m local_agents.watch): gleicht ab, sobald sich der
# Kalender aendert, und meldet, was sich geaendert hat.
[watch]
notify = true    # macOS-Mitteilung
speak = false    # zusaetzlich vorlesen

# Suche (python -m local_agents.search): Mit einem Embedding-Modell findet sie
# auch nach Bedeutung, nicht nur nach Worten. Vorher: ollama pull bge-m3
# [search]
# embeddings = "bge-m3"

# Nachrichten-Agent (python -m local_agents.message_agent): Anrede in den
# Entwuerfen, "du" oder "Sie". Der Gruss am Ende nimmt den Vornamen aus [person].
[messages]
form = "du"

# Nach dem Planen liest der Planungs-Agent eine kurze Uebersicht vor.
# Stimmen anzeigen: say -v '?' | grep de_DE
# model ist die Piper-Stimme; sie wird beim ersten Gebrauch heruntergeladen.
# Weitere Stimmen und Einstellungen: README, Abschnitt "Stimme anpassen".
# Mit model = "" spricht die macOS-Stimme aus voice.
[voice]
enabled = true
model = "de_DE-thorsten-high"
speed = 1.0
voice = "Anna"

# Die Antwort auf die Rueckfrage wird gesprochen und lokal erkannt (Whisper).
# Kleinere, schnellere Modelle: "small", "medium". Siehe README.
[listen]
enabled = true
model = "large-v3-turbo"
language = "de"

# Ollama-Modell: default gilt fuer alle Agenten, ein Agentenname fuer diesen
# einen. Ohne Eintrag gilt gpt-oss:20b (oder LOCAL_AGENTS_MODEL). Messwerte:
# README, Abschnitt "Modell je Agent".
[models]
# default = "qwen3.8:27b-mlx"
# status = "qwen3.5:9b-q8_0"

# Telegram fuer den Scrum Master: aus, solange enabled nicht true ist.
# ACHTUNG: Nachrichten laufen ueber die Server von Telegram und verlassen den
# Rechner. Einrichtung mit "python -m local_agents.telegram_bot einrichten",
# das traegt diesen Block mit deiner chat_id selbst ein. Siehe README.
# [telegram]
# enabled = true
# chat_id = 123456789
# ask_at = ["16:30"]        # Uhrzeiten, zu denen der Bot an Werktagen nachfragt
