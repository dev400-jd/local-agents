# yaml-language-server: $schema=termin_schema.json
# Erfundene Fälle für den Termin-Agenten: Erkennt er die Art des Termins?
# Aufbau: README, Abschnitt "Messen". Die ids der Terminarten stehen in
# local_agents/meeting_types.py. Wo mehrere Arten vertretbar sind, steht eine Liste.
# Die Ergebnisliste wird nur auf ihre Länge geprüft, nicht auf ihren Inhalt.
name: termin
cases:
# --- Stichwort im Titel
- name: "Daily"
  inputs:
    umgebung: &rollen {rolle_intern: "Teamleiter Data Science", rolle_kunde: "Solution Architect"}
    titel: "Daily Team Bestellimport"
    beginn: 2026-11-17T09:00:00
    minuten: 15
    eingeladene: 8
    kontext: kunde
  evaluators:
  - Terminart: {art: daily}
- name: "Sprint Review"
  inputs: {umgebung: *rollen, titel: "Sprint Review Bestellimport", beginn: 2026-11-19T15:00:00, minuten: 60, eingeladene: 14, kontext: kunde}
  evaluators:
  - Terminart: {art: sprint_review}
- name: "Retrospektive"
  inputs: {umgebung: *rollen, titel: "Retro Sprint 14", beginn: 2026-11-19T16:15:00, minuten: 60, eingeladene: 8, kontext: kunde}
  evaluators:
  - Terminart: {art: retrospektive}
- name: "Einzelgespräch"
  inputs: {umgebung: *rollen, titel: "1:1 Kim / Alex", beginn: 2026-11-18T11:00:00, minuten: 30, eingeladene: 2, kontext: intern}
  evaluators:
  - Terminart: {art: einzelgespraech}
- name: "Kick-off"
  inputs: {umgebung: *rollen, titel: "Kick-off Projekt Lieferantenportal", beginn: 2026-11-23T10:00:00, minuten: 90, eingeladene: 12, kontext: kunde}
  evaluators:
  - Terminart: {art: kickoff}
- name: "Große Runde"
  inputs: {umgebung: *rollen, titel: "Company Call November", beginn: 2026-11-20T13:00:00, minuten: 45, eingeladene: 180, kontext: intern}
  evaluators:
  - Terminart: {art: grosse_runde}
# --- Ohne Stichwort: Titel, Dauer und Zahl der Eingeladenen müssen reichen
- name: "Arbeitstermin ohne Stichwort"
  inputs: {umgebung: *rollen, titel: "Gemeinsam die Schnittstelle zum Shop entwerfen", beginn: 2026-11-18T13:00:00, minuten: 180, eingeladene: 5, kontext: kunde}
  evaluators:
  - Terminart: {art: workshop}
- name: "Störung ohne Stichwort"
  inputs: {umgebung: *rollen, titel: "Import liefert seit gestern falsche Bestellsummen", beginn: 2026-11-17T08:00:00, minuten: 30, eingeladene: 6, kontext: kunde}
  evaluators:
  - Terminart: {art: problemklaerung}
- name: "Bericht an die Leitung ohne Stichwort"
  inputs: {umgebung: *rollen, titel: "Quartalsbericht an die Geschäftsführung", beginn: 2026-11-24T14:00:00, minuten: 60, eingeladene: 9, kontext: intern}
  evaluators:
  - Terminart: {art: [steuerung, praesentation]}
- name: "Wöchentlicher Termin ohne Stichwort"
  inputs: {umgebung: *rollen, titel: "Wöchentliche Runde Datenplattform", beginn: 2026-11-18T10:00:00, minuten: 30, eingeladene: 6, kontext: intern}
  evaluators:
  - Terminart: {art: jour_fixe}
- name: "Infoveranstaltung ohne Stichwort"
  inputs: {umgebung: *rollen, titel: "Neue Reisekostenrichtlinie: Infoveranstaltung", beginn: 2026-11-25T11:00:00, minuten: 45, eingeladene: 150, kontext: intern}
  evaluators:
  - Terminart: {art: [grosse_runde, praesentation]}
- name: "Privates passt in keine Art"
  inputs: {umgebung: *rollen, titel: "Zahnarzt", beginn: 2026-11-26T08:00:00, minuten: 60, eingeladene: 0, kontext: intern}
  evaluators:
  - Terminart: {art: sonstiges}
# --- Stichwort führt in die Irre
- name: "Review im Titel, aber kein Sprint Review"
  inputs: {umgebung: *rollen, titel: "Review der Reisekostenabrechnung mit Kim", beginn: 2026-11-20T09:30:00, minuten: 30, eingeladene: 2, kontext: intern}
  evaluators:
  - Terminart: {nicht: [sprint_review]}   # welche Art stattdessen, ist Ansichtssache
