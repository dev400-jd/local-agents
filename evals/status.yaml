# yaml-language-server: $schema=status_schema.json
# Erfundene Fälle für den Status-Agenten. Aufbau: README, Abschnitt "Messen".
# Welche Aufgabe dran ist, bestimmt der Code; gemessen wird, ob die Sätze des
# Modells diese Aufgabe nennen, keine andere erwähnen und keine Zahl erfinden.
# Die Aufgaben bekommen die Nummern 1, 2, 3 ... in der Reihenfolge der Liste.
name: status
cases:
- name: "Heute fällige Aufgabe"
  inputs:
    umgebung: &woche
      jetzt: 2026-11-16T09:00:00   # ein Montag
      aufgaben:
      - {titel: "Vorbereitung: Architekturrunde (Di 17.11. 10:00)", faellig: 2026-11-16, termin: 2026-11-17T10:00:00}   # 1
      - {titel: "Vorbereitung: Sprint Review (Do 19.11. 15:00)", faellig: 2026-11-18, termin: 2026-11-19T15:00:00}   # 2
      - {titel: "Vorbereitung: Jour fixe (Fr 20.11. 11:00)", faellig: 2026-11-19, termin: 2026-11-20T11:00:00}   # 3
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Architekturrunde"]
      nennt_nicht: ["Sprint Review", "Jour fixe"]
- name: "Andere Frage, gleiche Aufgabe"
  inputs:
    umgebung: *woche
    eingabe: "Womit soll ich jetzt anfangen?"
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Architekturrunde"]
      nennt_nicht: ["Sprint Review", "Jour fixe"]
- name: "Überfällige Aufgabe geht vor"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben:
      - {titel: "Vorbereitung: Jour fixe (Di 17.11. 14:00)", faellig: 2026-11-16, termin: 2026-11-17T14:00:00}   # 1
      - {titel: "Vorbereitung: Kundenworkshop (Mo 16.11. 13:00)", faellig: 2026-11-15, termin: 2026-11-16T13:00:00}   # 2
  evaluators:
  - Status:
      naechste: 2
      nennt: ["Kundenworkshop"]
      nennt_nicht: ["Jour fixe"]
- name: "Termin hat schon begonnen und zählt nicht"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben:
      - {titel: "Vorbereitung: Daily (Mo 16.11. 08:30)", faellig: 2026-11-15, termin: 2026-11-16T08:30:00}   # 1
      - {titel: "Vorbereitung: Refinement (Di 17.11. 09:00)", faellig: 2026-11-16, termin: 2026-11-17T09:00:00}   # 2
  evaluators:
  - Status:
      naechste: 2
      nennt: ["Refinement"]
      nennt_nicht: ["Daily"]
- name: "Termin beginnt in wenigen Minuten"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben:
      - {titel: "Vorbereitung: Abstimmung Schnittstelle (Mo 16.11. 09:20)", faellig: 2026-11-15, termin: 2026-11-16T09:20:00}   # 1
      - {titel: "Vorbereitung: Sprint Review (Do 19.11. 15:00)", faellig: 2026-11-18, termin: 2026-11-19T15:00:00}   # 2
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Schnittstelle"]
      nennt_nicht: ["Sprint Review"]
- name: "Aufgabe ohne Termin"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben:
      - {titel: "Reisekosten einreichen", faellig: 2026-11-16}   # 1
      - {titel: "Vorbereitung: Sprint Review (Do 19.11. 15:00)", faellig: 2026-11-18, termin: 2026-11-19T15:00:00}   # 2
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Reisekosten"]
      nennt_nicht: ["Sprint Review"]
- name: "Nur später Fälliges"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben:
      - {titel: "Vorbereitung: Lenkungsausschuss (Fr 20.11. 09:00)", faellig: 2026-11-19, termin: 2026-11-20T09:00:00}   # 1
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Lenkungsausschuss"]
- name: "Viele Aufgaben, nur eine wird genannt"
  inputs:
    umgebung:
      jetzt: 2026-11-18T16:30:00   # ein Mittwoch
      aufgaben:
      - {titel: "Vorbereitung: Retrospektive (Do 19.11. 09:00)", faellig: 2026-11-18, termin: 2026-11-19T09:00:00}   # 1
      - {titel: "Vorbereitung: Sprint Review (Do 19.11. 15:00)", faellig: 2026-11-18, termin: 2026-11-19T15:00:00}   # 2
      - {titel: "Vorbereitung: Jour fixe (Fr 20.11. 11:00)", faellig: 2026-11-19, termin: 2026-11-20T11:00:00}   # 3
      - {titel: "Vorbereitung: Sprint Planning (Mo 23.11. 10:00)", faellig: 2026-11-22, termin: 2026-11-23T10:00:00}   # 4
      - {titel: "Vorbereitung: Kundenworkshop (Di 24.11. 13:00)", faellig: 2026-11-23, termin: 2026-11-24T13:00:00}   # 5
      - {titel: "Angebot prüfen", faellig: 2026-11-25}   # 6
  evaluators:
  - Status:
      naechste: 1
      nennt: ["Retrospektive"]
      nennt_nicht: ["Sprint Review", "Jour fixe", "Sprint Planning", "Kundenworkshop", "Angebot"]
- name: "Nichts steht an"
  inputs:
    umgebung:
      jetzt: 2026-11-16T09:00:00
      aufgaben: []
  evaluators:
  - Status:
      naechste: "keine"
