[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agents"
version = "0.1.0"
description = "Eigene Agenten mit Pydantic AI und lokalem Ollama-Modell"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.68",
    # Sprachausgabe (Piper), Mikrofon und Spracherkennung (Whisper), alles lokal.
    "piper-tts>=1.3",
    "sounddevice>=0.5",
    "pywhispercpp>=1.3",
    "numpy",
]

[project.optional-dependencies]
calendar = ["pyobjc-framework-EventKit>=13.0; sys_platform == 'darwin'"]

[tool.setuptools]
packages = ["local_agents"]
